name: Nush launchpad verification
on:
  push:
    branches: [main, feature/solana-launchpad-mvp]
  # Every pull request: server functions, the relay and the fee code live outside the launchpad paths.
  pull_request:
jobs:
  launchpad:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/launchpad*.test.mjs
      - run: npm run build
      - run: npm run check:netlify
      - name: Verify launchpad artifact
        run: test -f dist/launchpad.html
  existing-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
