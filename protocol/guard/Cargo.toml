[package]
name = "senro-guard"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
[lib]
crate-type = ["cdylib", "lib"]
[features]
no-entrypoint = []
[dependencies]
solana-program = "=2.3.0"
pump-adapter = { path = "../vendor/pump-adapter" }
[dev-dependencies]
litesvm = { version = "=0.16.0", features = ["precompiles"] }
solana-account = "4.3"
solana-address = "2.6"
solana-clock = "3.1"
solana-instruction = "3.4"
solana-keypair = "3.1.2"
solana-signer = "3.0.1"
solana-transaction = "4.1.5"
serde_json = "1"
base64 = "0.22"
